<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>原型 B：回力車象棋・戰術瞄準</title>
<style>
  * { box-sizing:border-box; }
  /* 手機：禁止長按選字、放大鏡、系統選單與點擊高亮，避免干擾拖曳 */
  html, body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  button, a { touch-action:manipulation; }
  body { margin:0; background:#1f2a24; color:#eef3e8; font:15px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { width:100%; max-width:560px; padding:8px 12px; display:flex; gap:8px; align-items:center; justify-content:space-between; }
  header a { color:#e8c88a; text-decoration:none; }
  #turn { font-weight:700; font-size:18px; }
  #bar { width:100%; max-width:560px; padding:0 12px 6px; display:flex; gap:8px; align-items:flex-start; }
  #info { flex:1; min-height:2.8em; font-size:14px; }
  canvas { width:min(96vw, 560px, calc((100vh - 140px) * 540 / 596)); display:block; touch-action:none; border-radius:6px; box-shadow:0 4px 18px #0008; }
  button { background:#e8c88a; color:#2b2118; border:0; border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  #fire { background:#e74c3c; color:#fff; font-weight:700; }
  #quick.on { background:#f1c40f; font-weight:700; }
  #quick:not(.on) { opacity:.6; }
  header, header * { white-space:nowrap; }
  header span button { padding:6px 8px; font-size:14px; }
  #bar.flip { transform:rotate(180deg); }   /* 面對面：輪到黑方時訊息列轉向黑方 */
  #lobby { position:fixed; inset:0; background:#000b; display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #lobby[hidden] { display:none; }
  #lobby .box { background:#2b3a31; border:1px solid #4d6355; border-radius:10px; padding:18px; width:100%; max-width:380px; -webkit-user-select:text; user-select:text; }
  #lobby h2 { margin:0 0 12px; font-size:19px; color:#e8c88a; }
  #lobby h3 { margin:14px 0 6px; font-size:15px; color:#cfe0d4; }
  #lobby button { width:100%; margin:4px 0; text-align:left; }
  #lobby small { color:#a9bcaf; }
  #lobby button small { color:#6b5a3a; }
  #lobby .row { display:flex; gap:6px; }
  #lobby .row button { width:auto; white-space:nowrap; }
  #lobby input { flex:1; min-width:0; font:inherit; padding:6px 8px; border-radius:4px; border:0; }
  #newver { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:20; background:#2ecc71; color:#08311a;
            font-weight:700; box-shadow:0 4px 14px #0008; padding:10px 18px; border-radius:20px; }
  #newver[hidden] { display:none; }
  #ver { color:#a9bcaf; font-size:12px; text-align:right; margin-top:8px; }
  #netStatus { margin-top:10px; min-height:1.5em; color:#ffd166; font-size:14px; word-break:break-all; }
  table { margin:10px 0 20px; border-collapse:collapse; font-size:13px; }
  td, th { padding:3px 8px; border-bottom:1px solid #3d4f44; text-align:center; }
</style>
</head>
<body>
<header>
  <a href="index.html">← 選單</a>
  <span id="turn"></span>
  <span><button id="quick" title="快速模式：點綠點立即出發，不需確認">⚡快速</button> <button id="mute" title="音效開關">🔊</button> <button id="menu" title="對戰模式／重新開始">☰</button></span>
</header>
<div id="bar"><div id="info"></div><button id="fire" hidden>出發</button><button id="skip" disabled>不射擊</button></div>
<canvas id="cv"></canvas>
<table id="legend"></table>
<button id="newver" hidden>🆕 有新版本，點此更新</button>
<div id="lobby" hidden><div class="box">
  <h2>對戰模式</h2>
  <button id="mLocal">📱 同裝置・並排<br><small>兩人輪流用同一支手機／電腦</small></button>
  <button id="mFace">🔄 同裝置・面對面<br><small>平板放桌上，兩人對坐，黑方文字倒轉</small></button>
  <h3>🌐 兩台裝置連線</h3>
  <button id="mHost">建立房間（我執紅先手）</button>
  <div class="row"><input id="roomIn" inputmode="numeric" maxlength="4" placeholder="輸入 4 位數房號"><button id="mJoin">加入（執黑）</button></div>
  <div id="netStatus"></div>
  <h3>其他</h3>
  <button id="mRestart">↺ 重新開始這局</button>
  <button id="mReload">🔄 重新整理（載入最新版）</button>
  <div id="ver"></div>
  <button id="mClose">✕ 關閉</button>
</div></div>
<script>
// ===== 原型 B：移動 + 手動瞄準 =====
// 回合 = ① 拉動一台車（或輕點原地不動） ② 從射程內的敵人中點選目標開火。
// 直射武器會被中間的棋子擋住；炮為曲射可越過棋子但有最小射程。
// 河道泥濘（摩擦加倍），帥/將被限制在九宮內。
const C = 56, M = 46, W = C * 8 + M * 2, H = C * 9 + M * 2, R = 21;
const FR = 900, RIVER_FR = 2.6, MAXPULL = 120, E = 0.85, DPR = 2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
// 擋掉長按選單／選字／捲動等瀏覽器預設手勢（pointer 事件仍正常觸發）
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('selectstart', e => e.preventDefault());
const gx = c => M + c * C, gy = r => M + r * C;

const SIDE = [{ name: '紅方', col: '#c0392b' }, { name: '黑方', col: '#1d1d1d' }];
const TYPES = {
  K: { n: ['帥', '將'], hp: 3, dist: 1.5 * C, range: 1.5 * C, min: 0,     dmg: 1, mass: 3,   w: '手槍',   snd: 'pistol', proj: 'bullet', palace: true },
  R: { n: ['俥', '車'], hp: 4, dist: 7 * C,   range: 3 * C,   min: 0,     dmg: 2, mass: 2,   w: '機槍',   snd: 'mg',     proj: 'burst' },
  N: { n: ['傌', '馬'], hp: 3, dist: 4.5 * C, range: 3.4 * C, min: 0,     dmg: 2, mass: 1.5, w: '火箭',   snd: 'rocket', proj: 'rocket' },
  C: { n: ['炮', '砲'], hp: 3, dist: 2.5 * C, range: 5.2 * C, min: 2 * C, dmg: 1.5, mass: 1.5, w: '曲射砲', snd: 'mortar', proj: 'shell', indirect: true, reload: 3, splash: 1.5 * C },   // 射後需裝填 3 回合；上下左右相鄰受 1/2 傷害、斜角受 1/4（無條件捨去到 ¼ 心）
  // 相／象：防空，不能攻擊；自動攔截落點在 2 格內的火箭／砲彈，攔截後冷卻 2 回合；過河後每次只能走一格
  // 仕／士：護衛，不能攻擊；限九宮斜走一格；帥被直接攻擊時，相鄰的士衝出來替帥擋下
  G: { n: ['仕', '士'], hp: 3, dist: 1.5 * C, range: 0,       min: 0,     dmg: 0, mass: 1.5, w: '無（護衛）', palace: true, guard: true },
  E: { n: ['相', '象'], hp: 3, dist: 3 * C,   range: 0,       min: 0,     dmg: 0, mass: 1.5, w: '防空攔截', aa: 2 * C, reload: 2 },
  P: { n: ['兵', '卒'], hp: 2, dist: 1 * C,   range: 1.8 * C, min: 0,     dmg: 1, mass: 1,   w: '步槍',   snd: 'rifle',  proj: 'bullet', tag: '（未過河）', locked: true },
  // 過河兵：自由移動，霰彈槍 9 發彈丸呈扇形，越近命中越多（傷害與命中數成正比，全中 2 心）
  P2: { n: ['兵', '卒'], hp: 2, dist: 3.5 * C, range: 2.6 * C, min: 0,    dmg: 2, mass: 1,   w: '霰彈槍', snd: 'shotgun', proj: 'pellets', tag: '（過河）',
        pellets: 9, cone: 30 * Math.PI / 180 },
};
const LAYOUT = [['K',4,9],['G',3,9],['G',5,9],['R',0,9],['R',8,9],['N',1,9],['N',7,9],['E',2,9],['E',6,9],['C',1,7],['C',7,7],
                ['P',0,6],['P',2,6],['P',4,6],['P',6,6],['P',8,6]];

let pieces, turn, state, mover, timer, fx, winner, targets;
let moved = false, firedPiece = null, sel = null;   // moved：本回合已移動；sel：目前選取的棋子 {p, moves 可走的點, dest 目的地, scan 原地可攻擊}
// 對戰模式：local＝同裝置並排、face＝同裝置面對面（黑方文字倒轉）、online＝兩台裝置連線
let mode = 'local', mySide = 0, conn = null, pendingEnd = null;
const online = () => mode === 'online';
const myTurn = () => !online() || turn === mySide;
const viewFlip = () => online() && mySide === 1;   // 連線時執黑的一方，棋盤轉 180° 讓自己在下方
// 文字朝向：讓該方玩家讀起來是正的
const textAng = side => (viewFlip() ? Math.PI : 0) + (mode === 'face' && side === 1 ? Math.PI : 0);
const $ = id => document.getElementById(id);
const alive = () => pieces.filter(p => p.hp > 0);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const setMsg = s => $('info').textContent = s;
// 血量與傷害都以愛心計，最小單位 ¼ 心
const quarter = x => Math.floor(x * 4 + 1e-9) / 4;
const hearts = n => {
  const w = Math.floor(n), f = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[n - w] || '';
  return w ? '♥'.repeat(w) + f : f + '♥';
};
const rnd = k => (Math.random() - 0.5) * 2 * k;

// ----- 音效（Web Audio 即時合成，不需要音檔） -----
const SFX = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('rc-mute') === '1'; } catch (e) {}
  const VOL = 0.6;
  function init() {   // 瀏覽器規定要在使用者操作後才能出聲
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : VOL; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  // 振盪器：波形、起訖頻率、長度、音量、延遲
  function tone(type, f0, f1, dur, vol, delay = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  // 濾波噪音：濾波起訖頻率、長度、音量、延遲
  function noise(f0, f1, dur, vol, delay = 0, type = 'lowpass', q = 1) {
    const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.02);
  }
  const S = {
    click:   () => tone('square', 1000, 700, 0.04, 0.08),
    launch:  k => { noise(500, 3500, 0.35, 0.2 + 0.25 * k, 0, 'bandpass', 2); tone('sawtooth', 110, 140 + 320 * k, 0.4, 0.06); },
    bump:    v => { const k = Math.min(1, v / 600); tone('sine', 190, 55, 0.16, 0.45 * k); noise(2200, 300, 0.08, 0.3 * k); },
    pistol:  () => { noise(4000, 400, 0.12, 0.5); tone('square', 650, 120, 0.08, 0.14); },
    mg:      () => { for (let i = 0; i < 4; i++) { noise(5000, 500, 0.07, 0.42, i * 0.07); tone('square', 520, 140, 0.05, 0.1, i * 0.07); } },
    rifle:   () => { noise(6500, 300, 0.22, 0.6); tone('triangle', 950, 90, 0.16, 0.2); },
    rocket:  () => { noise(700, 3200, 0.5, 0.35, 0, 'bandpass', 1.5); tone('sawtooth', 180, 620, 0.45, 0.05); },
    mortar:  () => { tone('sine', 150, 40, 0.25, 0.7); noise(700, 100, 0.25, 0.4); tone('sine', 2300, 650, 0.65, 0.05, 0.15); },
    hit:     () => { tone('square', 320, 80, 0.12, 0.22); noise(3000, 200, 0.15, 0.35); },
    boom:    big => { noise(1800, 50, big ? 1.3 : 0.7, big ? 0.9 : 0.6); tone('sine', 110, 28, big ? 0.9 : 0.5, big ? 0.8 : 0.5); },
    shotgun: () => { noise(3500, 150, 0.35, 0.85); tone('square', 220, 50, 0.14, 0.3);
                     noise(2500, 1800, 0.05, 0.25, 0.32, 'bandpass', 3); noise(2000, 1500, 0.06, 0.25, 0.45, 'bandpass', 3); },  // 砰＋上膛
    promote: () => [392, 523, 659].forEach((f, i) => tone('square', f, f, 0.12, 0.1, i * 0.08)),
    aa:      () => { noise(1200, 6000, 0.3, 0.35, 0, 'bandpass', 2); tone('square', 700, 1900, 0.18, 0.06); },   // 攔截飛彈升空
    win:     () => [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, i === 3 ? 0.7 : 0.3, 0.25, i * 0.14)),
  };
  return {
    init,
    play(n, ...a) { if (ac && !muted) S[n](...a); },
    toggle() {
      muted = !muted;
      try { localStorage.setItem('rc-mute', muted ? '1' : '0'); } catch (e) {}
      if (master) master.gain.value = muted ? 0 : VOL;
      return muted;
    },
    get muted() { return muted; },
  };
})();

// ----- 粒子特效 -----
let parts = [], decals = [], shake = 0, lastBump = 0;
// o: {k 種類, sp 速度, life 壽命, size, col, dir 方向（省略＝四散）, spread 擴散角, drag 阻力}
function emit(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = o.dir === undefined ? Math.random() * Math.PI * 2 : o.dir + rnd((o.spread || 1) / 2);
    const sp = o.sp * (0.3 + Math.random() * 0.7), L = o.life * (0.6 + Math.random() * 0.4);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: L, L, size: o.size * (0.6 + Math.random() * 0.6),
                 col: o.col, k: o.k, drag: o.drag ?? 3, rot: Math.random() * 6 });
  }
}
function flashAt(x, y, size, t = 0.12) { parts.push({ x, y, vx: 0, vy: 0, t, L: t, size, k: 'flash', drag: 0 }); }
function muzzle(x, y, dir, big) {
  flashAt(x, y, big ? 26 : 16);
  emit(x, y, big ? 10 : 5, { k: 'spark', sp: 260, life: 0.18, size: 2, col: '#ffe066', dir, spread: 0.9 });
  emit(x, y, big ? 6 : 2, { k: 'smoke', sp: 50, life: 0.7, size: 8, col: '#888', dir, spread: 1.2 });
}
function explode(x, y, big) {
  flashAt(x, y, big ? 60 : 34, big ? 0.16 : 0.1);
  parts.push({ x, y, vx: 0, vy: 0, t: 0.35, L: 0.35, size: big ? 75 : 42, k: 'ring', drag: 0 });
  emit(x, y, big ? 40 : 18, { k: 'spark', sp: big ? 340 : 230, life: 0.5, size: 2.5, col: '#ffd23f' });
  emit(x, y, big ? 16 : 8,  { k: 'fire',  sp: big ? 120 : 80,  life: 0.45, size: big ? 16 : 11, col: '#ff7a1a' });
  emit(x, y, big ? 18 : 8,  { k: 'smoke', sp: big ? 60 : 40,   life: big ? 1.5 : 1, size: big ? 18 : 12, col: '#555' });
  if (big) emit(x, y, 12, { k: 'debris', sp: 280, life: 0.9, size: 5, col: '#3a2a1a', drag: 2.5 });
  decals.push({ x: x + rnd(4), y: y + rnd(4), r: big ? 30 + Math.random() * 6 : 13 });
  shake = Math.max(shake, big ? 12 : 5);
}
function bumpFX(x, y, v) {
  const now = performance.now();
  if (now - lastBump > 60) { SFX.play('bump', v); lastBump = now; }
  if (v > 250) emit(x, y, 6, { k: 'spark', sp: 180, life: 0.25, size: 2, col: '#fff3b0' });
  if (v > 450) shake = Math.max(shake, 3);
}
function updParts(dt) {
  for (const p of parts) {
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f;
    if (p.k === 'smoke') p.y -= 12 * dt;
  }
  parts = parts.filter(p => p.t > 0);
  shake = Math.max(0, shake - 40 * dt);
}

function reset() {
  pieces = [];
  for (let s = 0; s < 2; s++)
    for (const [t, c, r] of LAYOUT) {
      const T = TYPES[t];
      pieces.push({ s, t, T, x: gx(c), y: gy(s ? 9 - r : r), vx: 0, vy: 0, hp: T.hp, hd: s ? Math.PI / 2 : -Math.PI / 2, flash: 0, recoil: 0, cd: 0 });
    }
  turn = 0; state = 'aim'; sel = null; fx = []; moved = false; firedPiece = null; winner = null; targets = []; parts = []; decals = []; shake = 0;
  updateHeader(); $('skip').disabled = true;
  setMsg('拉動己方棋子移動（輕點＝原地不動），停下後點選要攻擊的敵人。');
}
function updateHeader() {
  $('turn').textContent = online() ? (myTurn() ? `你的回合（${SIDE[turn].name}）` : `對手回合（${SIDE[turn].name}）`) : SIDE[turn].name + ' 回合';
  $('turn').style.color = turn ? '#ddd' : '#ff7b6b';
  // 面對面：訊息列移到目前玩家那一側（黑方在上、文字倒轉）
  const bar = $('bar'), face = mode === 'face';
  if (face && turn === 0) cv.after(bar); else cv.before(bar);
  bar.classList.toggle('flip', face && turn === 1);
  if (online() && !myTurn() && state === 'aim') setMsg('等待對手操作…');
}

// ----- 物理 -----
const inRiver = p => p.y > gy(4) && p.y < gy(5);
function bounds(p) {
  if (p.T.palace) return p.s ? [gx(3), gy(0), gx(5), gy(2)] : [gx(3), gy(7), gx(5), gy(9)];
  return [R, R, W - R, H - R];
}
function moveOne(p, dt) {
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > 0) {
    const ns = Math.max(0, sp - FR * (inRiver(p) ? RIVER_FR : 1) * dt);
    p.vx *= ns / sp; p.vy *= ns / sp;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  const [x0, y0, x1, y1] = bounds(p);
  let bump = 0;   // 撞牆速度（給音效用）
  if (p.x < x0) { p.x = x0; bump = Math.abs(p.vx); p.vx = -p.vx * 0.6; }
  if (p.x > x1) { p.x = x1; bump = Math.abs(p.vx); p.vx = -p.vx * 0.6; }
  if (p.y < y0) { p.y = y0; bump = Math.max(bump, Math.abs(p.vy)); p.vy = -p.vy * 0.6; }
  if (p.y > y1) { p.y = y1; bump = Math.max(bump, Math.abs(p.vy)); p.vy = -p.vy * 0.6; }
  return bump;
}
function physics(dt) {
  const ps = alive();
  for (const p of ps) {
    const bump = moveOne(p, dt), sp = Math.hypot(p.vx, p.vy);
    if (bump > 100) bumpFX(p.x, p.y, bump);
    if (sp > 40) p.hd = Math.atan2(p.vy, p.vx);
    if (sp > 150 && Math.random() < 0.15)   // 車尾揚起塵土（河道是水花）
      emit(p.x - Math.cos(p.hd) * R, p.y - Math.sin(p.hd) * R, 1,
           { k: 'smoke', sp: 30, life: 0.6, size: 7, col: inRiver(p) ? '#9cc3d5' : '#b89a6a', dir: p.hd + Math.PI, spread: 1.5 });
  }
}
// ----- 定點移動：每次移動都停在棋盤交叉點上 -----
const fwd = p => p.s ? 1 : -1;
const crossed = (s, y) => s ? y > gy(4.5) : y < gy(4.5);

      ctx.strokeStyle = '#fff7c2'; ctx.lineWidth = 2; line(x - Math.cos(r.dir) * 8, y - Math.sin(r.dir) * 8, x, y);
      circle(x, y, 1.8); ctx.fillStyle = '#ffd23f'; ctx.fill();
    }
    return;
  }
  if (f.k === 'bullet') {
    const bx = x - Math.cos(f.dir) * 16, by = y - Math.sin(f.dir) * 16;
    ctx.strokeStyle = '#fff7c2'; ctx.lineWidth = 3; line(bx, by, x, y);
    ctx.strokeStyle = f.side ? '#555' : '#ff6b4a'; ctx.lineWidth = 1; line(bx, by, x, y);
  } else if (f.k === 'rocket') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(f.dir);
    ctx.fillStyle = '#ffb030'; ctx.beginPath(); ctx.moveTo(-8, -3); ctx.lineTo(-16 - Math.random() * 6, 0); ctx.lineTo(-8, 3); ctx.fill();
    ctx.fillStyle = f.side ? '#333' : '#b03020'; ctx.fillRect(-8, -3, 14, 6);
    ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(6, -3); ctx.lineTo(11, 0); ctx.lineTo(6, 3); ctx.fill();
    ctx.restore();
  } else if (f.k === 'shell') {
    const lift = Math.sin(k * Math.PI);
    ctx.fillStyle = `rgba(0,0,0,${0.35 - lift * 0.2})`;   // 地面影子
    ctx.beginPath(); ctx.ellipse(gx0, gy0, 7 - lift * 3, 4 - lift * 2, 0, 0, Math.PI * 2); ctx.fill();
    circle(x, y, 5 + lift * 3); ctx.fillStyle = '#222'; ctx.fill();
    circle(x - 1.5, y - 1.5, 1.5 + lift); ctx.fillStyle = '#888'; ctx.fill();
  }
}
function draw() {
  ctx.save();
  if (viewFlip()) { ctx.translate(W, H); ctx.rotate(Math.PI); }
  if (shake) ctx.translate(rnd(shake), rnd(shake));
  drawBoard();
  drawDecals();
  // 交叉點標記（可停的定點）與相的防空範圍（冷卻中變灰）
  ctx.fillStyle = '#6b442355';
  for (let c = 0; c <= 8; c++) for (let r = 0; r <= 9; r++) { circle(gx(c), gy(r), 2.5); ctx.fill(); }
  for (const h of alive()) if (h.T.aa && !(sel && sel.p === h)) {
    circle(h.x, h.y, h.T.aa); ctx.strokeStyle = h.cd ? '#7775' : '#2f6fb570'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]);
  }
  if (state === 'aim') for (const p of alive()) if (p.s === turn) {
    circle(p.x, p.y, R + 5); ctx.strokeStyle = turn ? '#0005' : '#c0392b66'; ctx.lineWidth = 3; ctx.stroke();
  }
  let preview = [];
  let markT = state === 'target' && mover ? mover.T : null, ghost = false;
  if (sel) {
    const p = sel.p;
    circle(p.x, p.y, R + 6); ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3; ctx.stroke();
    let ex = p.x, ey = p.y;
    if (sel.dest) {
      [ex, ey] = sel.dest;
      ctx.strokeStyle = SIDE[p.s].col; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); line(p.x, p.y, ex, ey); ctx.setLineDash([]);
      circle(ex, ey, R); ctx.stroke();
    }
    const T = p.T.locked && crossed(p.s, ey) ? TYPES.P2 : p.T;   // 這步會過河就用霰彈槍預覽
    rangeRing({ T }, ex, ey);
    for (const [x, y] of sel.moves) {   // 可走的點
      const on = sel.dest && sel.dest[0] === x && sel.dest[1] === y;
      circle(x, y, on ? 11 : 8); ctx.fillStyle = on ? '#ffd400' : '#2ecc71cc'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
    // 未選目的地：顯示原地可攻擊的目標；已選：預覽到目的地後可打到誰（淡色）
    preview = sel.dest ? scan(p, ex, ey, T) : sel.scan; markT = T; ghost = !!sel.dest;
    if (p.T.aa) for (const q of alive())   // 預覽：哪些友軍會在防空保護範圍內
      if (q !== p && q.s === p.s && Math.hypot(q.x - ex, q.y - ey) <= p.T.aa + 1) {
        circle(q.x, q.y, R + 5); ctx.strokeStyle = '#2f6fb5aa'; ctx.lineWidth = 3; ctx.stroke();
      }
  }
  if (state === 'target') {
    rangeRing(mover, mover.x, mover.y);
    if (!moved) { circle(mover.x, mover.y, R + 6); ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]); }
  }
  for (const k of alive()) if (k.t === 'K')   // 護衛連線：帥與旁邊的士
    for (const g of alive()) if (g.s === k.s && g.T.guard && Math.hypot(g.x - k.x, g.y - k.y) <= 1.5 * C + 1) {
      ctx.strokeStyle = '#2f6fb588'; ctx.lineWidth = 4; ctx.setLineDash([2, 5]); line(k.x, k.y, g.x, g.y); ctx.setLineDash([]);
    }
  for (const p of alive()) drawPiece(p);
  marks(state === 'target' ? targets : preview, markT, ghost);
  for (const f of fx) if (f.k !== 'txt') drawProj(f);
  drawParts();
  for (const f of fx) if (f.k === 'txt') {
    const a = f.t / f.T;
    ctx.globalAlpha = Math.min(1, a * 2); ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; textAt(f.txt, Math.min(W - 70, Math.max(70, f.x)), f.y, -(1 - a) * 30, textAng(f.side ?? turn), f.col || '#e00', '#fff');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (state === 'over') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    const title = online() ? (winner === mySide ? '你贏了！' : '你輸了…') : SIDE[winner].name + ' 勝利！';
    // 面對面時上下各一份，兩位玩家都看得到
    for (const ang of mode === 'face' ? [0, Math.PI] : [0]) {
      ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(ang);
      const dy = mode === 'face' ? 90 : 0;
      ctx.fillStyle = winner ? '#fff' : '#ff7b6b'; ctx.font = 'bold 44px sans-serif'; ctx.fillText(title, 0, dy - 10);
      ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif'; ctx.fillText('點擊棋盤重新開始', 0, dy + 34);
      ctx.restore();
    }
  }
}
let last = performance.now();
function loop(now) { update(Math.min(0.05, (now - last) / 1000)); last = now; draw(); requestAnimationFrame(loop); }

$('legend').innerHTML = '<tr><th>兵種</th><th>武器</th><th>血量</th><th>移動(格)</th><th>射程(格)</th><th>威力</th><th>特性</th></tr>' +
  Object.values(TYPES).map(T => `<tr><td>${T.n.join('/')}${T.tag || ''}</td><td>${T.w}</td><td style="color:#e8202a">${hearts(T.hp)}</td><td>${(T.dist / C).toFixed(1)}</td>` +
    `<td>${T.guard ? '護衛' : T.aa ? '攔截 ' + (T.aa / C).toFixed(1) : (T.min ? (T.min / C).toFixed(1) + '～' : '') + (T.range / C).toFixed(1)}</td><td style="color:#e8202a">${T.guard ? '-' : T.aa ? '-' : hearts(T.dmg)}</td>` +
    `<td>${T.indirect ? `曲射，越過障礙；相鄰受 1/2、斜角受 1/4 傷害（敵我皆傷）；射後裝填 ${T.reload} 回合` : T.guard ? '限九宮斜走一格；帥被攻擊時衝出來替帥擋下（炮的波及擋不住）' : T.palace ? '限九宮' : T.aa ? `自動攔截落點在範圍內的火箭／砲彈（冷卻 ${T.reload} 回合）；不能攻擊；過河後每次只能走一格` : T.locked ? '只能前進一格' : T.pellets ? '扇形霰彈，越近越痛' : '直射，會被擋'}</td></tr>`).join('');
// ===== 版本與重新整理 =====
// 每次更新遊戲都要改 VERSION；頁面會定期抓 GitHub 上的最新檔案比對，有新版就提示
const VERSION = '2026-10-18.7';
$('ver').textContent = '版本 ' + VERSION;
// 重新整理並略過瀏覽器快取（網址加上時間戳記）
function reloadFresh() {
  if (online() && conn && conn.open && !confirm('重新整理會中斷目前的連線對戰，確定嗎？')) return;
  const q = new URLSearchParams(location.search);
  q.set('v', Date.now());
  location.replace(location.pathname + '?' + q);
}
async function checkUpdate() {
  try {
    const txt = await (await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })).text();
    const v = (txt.match(/const VERSION = '([^']+)'/) || [])[1];
    $('newver').hidden = !v || v === VERSION;
  } catch (e) { /* 離線時略過 */ }
}
$('mReload').onclick = reloadFresh;
$('newver').onclick = reloadFresh;
if (location.protocol.startsWith('http')) {
  checkUpdate();
  setInterval(checkUpdate, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
}

// ===== 對戰模式與連線 =====
// 連線做法：輪到誰，誰的裝置就是「主控」——它算物理、把動作（出發／開火）送給對方播放動畫，
// 回合結束時送出完整局面快照，對方直接套用，兩台裝置就不會因浮點誤差而越跑越不同步。
function snapshot() {
  return { turn, winner, ps: pieces.map(p => [p.x, p.y, p.hp, p.cd, p.T === TYPES.P2 ? 1 : 0, p.hd]) };
}
function applySnap(sn) {
  sn.ps.forEach(([x, y, hp, cd, pr, hd], i) => {
    const p = pieces[i];
    Object.assign(p, { x, y, hp, cd, hd, vx: 0, vy: 0 });
    if (pr) p.T = TYPES.P2;
  });
  turn = sn.turn; winner = sn.winner;
}
function applyEnd() {
  const sn = pendingEnd; pendingEnd = null;
  applySnap(sn);
  targets = []; moved = false; sel = null; setSkip(false);
  if (winner !== null) { state = 'over'; SFX.play('win'); }
  else { state = 'aim'; setMsg(myTurn() ? '輪到你了！拉動己方棋子移動，停下後點選要攻擊的敵人。' : '等待對手操作…'); }
  updateHeader();
}
function send(m) { if (online() && conn && conn.open) conn.send(m); }
function onNet(m) {
  if (m.t === 'reset') { reset(); setMsg('對手重新開始了一局。'); return; }
  if (m.t === 'launch') {
    const p = pieces[m.i];
    p.vx = m.vx; p.vy = m.vy; p.hd = Math.atan2(m.vy, m.vx); mover = p;
    SFX.play('launch', 0.7); state = 'moving'; setMsg('對手出發！');
  } else if (m.t === 'shoot') {
    applySnap(m.snap);   // 先對齊停下的位置再播開火
    state = 'fire'; timer = 0.5; mover = pieces[m.a];
    shoot(pieces[m.a], pieces[m.b]);
  } else if (m.t === 'end') {
    pendingEnd = m.snap;
    if (!['moving', 'settle', 'fire'].includes(state)) applyEnd();   // 否則等動畫播完（onStop／endTurn）再套用
  }
}
function restart() {
  reset();
  send({ t: 'reset' });
}
function setMode(m, side = 0) {
  if (m !== 'online' && conn) { try { conn.close(); } catch (e) {} conn = null; }
  mode = m; mySide = side; pendingEnd = null;
  reset();
  $('lobby').hidden = true;
}
const netStatus = s => $('netStatus').innerHTML = s;

// --- PeerJS（WebRTC 點對點；房號＝在免費的 PeerJS 公用伺服器上的 ID） ---
let peer = null;
const peerId = code => 'rc-chess-b-' + code;
function loadPeer() {
  return window.Peer ? Promise.resolve() : new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = 'vendor/peerjs.min.js'; sc.onload = ok; sc.onerror = () => fail(new Error('載入連線模組失敗'));
    document.head.appendChild(sc);
  });
}
const netErr = e => ({ network: '連不上配對伺服器，請檢查網路', 'server-error': '配對伺服器暫時無法使用，請稍後再試',
                       'browser-incompatible': '這個瀏覽器不支援連線對戰' })[e.type] || (e.type || e.message);
function bindConn(c, side) {
  conn = c;
  c.on('data', onNet);
  c.on('open', () => {
    mode = 'online'; mySide = side; pendingEnd = null;
    reset(); $('lobby').hidden = true;
    netStatus('✅ 已連線');
    setMsg(side === 0 ? '對手已加入！你執紅先手，開始吧。' : '已加入房間！你執黑，等待紅方先手…');
  });
  c.on('close', () => { if (conn === c) { conn = null; setMsg('⚠ 連線中斷，可按 ☰ 重新建立房間。'); netStatus('⚠ 連線中斷'); } });
  c.on('error', e => netStatus('⚠ ' + e.message));
}
async function host() {
  netStatus('建立房間中…');
  try { await loadPeer(); } catch (e) { netStatus('⚠ ' + e.message); return; }
  if (peer) peer.destroy();
  const code = String(1000 + Math.floor(Math.random() * 9000));
  peer = new Peer(peerId(code));
  peer.on('open', () => {
    const link = location.href.split('?')[0] + '?room=' + code;
    netStatus(`房號 <b style="font-size:22px">${code}</b>，等待對手加入…<br>或把連結傳給對方：<br><small>${link}</small>` +
              `<br><button id="copyLink" style="width:auto">複製連結</button>`);
    $('copyLink').onclick = () => navigator.clipboard?.writeText(link).then(() => $('copyLink').textContent = '已複製 ✓');
  });
  peer.on('connection', c => { if (conn && conn.open) { c.close(); return; } bindConn(c, 0); });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') host();   // 房號撞到，換一個
    else netStatus('⚠ 無法建立房間：' + netErr(e));
  });
}
async function join(code) {
  code = String(code).trim();
  if (!/^\d{4}$/.test(code)) { netStatus('請輸入 4 位數房號'); return; }
  netStatus('連線中…');
  try { await loadPeer(); } catch (e) { netStatus('⚠ ' + e.message); return; }
  if (peer) peer.destroy();
  peer = new Peer();
  peer.on('open', () => bindConn(peer.connect(peerId(code), { reliable: true, serialization: 'json' }), 1));
  peer.on('error', e => netStatus(e.type === 'peer-unavailable' ? '⚠ 找不到這個房間，請確認房號' : '⚠ 連線失敗：' + netErr(e)));
}
// 測試用：?bc=房名&side=0|1 用 BroadcastChannel 在同一台電腦的兩個分頁之間連線
function bcConnect(room, side) {
  const ch = new BroadcastChannel('rc-chess-' + room), hs = {};
  const c = { open: false, send: m => ch.postMessage(m), close() { ch.close(); }, on: (ev, fn) => hs[ev] = fn };
  ch.onmessage = e => {
    if (e.data === 'hello' || e.data === 'ack') {
      if (e.data === 'hello') ch.postMessage('ack');
      if (!c.open) { c.open = true; hs.open && hs.open(); }
    } else hs.data && hs.data(e.data);
  };
  bindConn(c, side);
  ch.postMessage('hello');
}

$('menu').onclick = () => { SFX.init(); $('lobby').hidden = false; };
$('mClose').onclick = () => $('lobby').hidden = true;
$('mLocal').onclick = () => setMode('local');
$('mFace').onclick = () => setMode('face');
$('mHost').onclick = () => host();
$('mJoin').onclick = () => join($('roomIn').value);
$('roomIn').onkeydown = e => { if (e.key === 'Enter') join($('roomIn').value); };
$('mRestart').onclick = () => { restart(); $('lobby').hidden = true; };

reset();
requestAnimationFrame(loop);
{
  const q = new URLSearchParams(location.search);
  if (q.get('bc')) bcConnect(q.get('bc'), +q.get('side') || 0);
  else if (q.get('room')) { $('lobby').hidden = false; $('roomIn').value = q.get('room'); join(q.get('room')); }
  else $('lobby').hidden = false;   // 一開始先選對戰模式
}
</script>
