<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>原型 B：回力車象棋・戰術瞄準</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1f2a24; color:#eef3e8; font:15px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { width:100%; max-width:560px; padding:8px 12px; display:flex; gap:8px; align-items:center; justify-content:space-between; }
  header a { color:#e8c88a; text-decoration:none; }
  #turn { font-weight:700; font-size:18px; }
  #bar { width:100%; max-width:560px; padding:0 12px 6px; display:flex; gap:8px; align-items:flex-start; }
  #info { flex:1; min-height:2.8em; font-size:14px; }
  canvas { width:min(96vw, 560px, calc((100vh - 140px) * 520 / 576)); display:block; touch-action:none; border-radius:6px; box-shadow:0 4px 18px #0008; }
  button { background:#e8c88a; color:#2b2118; border:0; border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  table { margin:10px 0 20px; border-collapse:collapse; font-size:13px; }
  td, th { padding:3px 8px; border-bottom:1px solid #3d4f44; text-align:center; }
</style>
</head>
<body>
<header>
  <a href="index.html">← 選單</a>
  <span id="turn"></span>
  <button id="restart">重新開始</button>
</header>
<div id="bar"><div id="info"></div><button id="skip" disabled>不射擊</button></div>
<canvas id="cv"></canvas>
<table id="legend"></table>
<script>
// ===== 原型 B：移動 + 手動瞄準 =====
// 回合 = ① 拉動一台車（或輕點原地不動） ② 從射程內的敵人中點選目標開火。
// 直射武器會被中間的棋子擋住；炮為曲射可越過棋子但有最小射程。
// 河道泥濘（摩擦加倍），帥/將被限制在九宮內。
const C = 56, M = 36, W = C * 8 + M * 2, H = C * 9 + M * 2, R = 21;
const FR = 900, RIVER_FR = 2.6, MAXPULL = 120, E = 0.85, DPR = 2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
const gx = c => M + c * C, gy = r => M + r * C;

const SIDE = [{ name: '紅方', col: '#c0392b' }, { name: '黑方', col: '#1d1d1d' }];
const TYPES = {
  K: { n: ['帥', '將'], hp: 10, dist: 1.5 * C, range: 1.5 * C, min: 0,     dmg: 1, mass: 3,   w: '手槍',   palace: true },
  R: { n: ['俥', '車'], hp: 8,  dist: 7 * C,   range: 2.6 * C, min: 0,     dmg: 2, mass: 2,   w: '機槍' },
  N: { n: ['傌', '馬'], hp: 6,  dist: 4.5 * C, range: 3.4 * C, min: 0,     dmg: 3, mass: 1.5, w: '火箭' },
  C: { n: ['炮', '砲'], hp: 5,  dist: 2.5 * C, range: 5.2 * C, min: 2 * C, dmg: 3, mass: 1.5, w: '曲射砲', indirect: true },
  P: { n: ['兵', '卒'], hp: 4,  dist: 3.5 * C, range: 1.8 * C, min: 0,     dmg: 2, mass: 1,   w: '步槍' },
};
const LAYOUT = [['K',4,9],['R',0,9],['R',8,9],['N',1,9],['N',7,9],['C',1,7],['C',7,7],
                ['P',0,6],['P',2,6],['P',4,6],['P',6,6],['P',8,6]];

let pieces, turn, state, drag, mover, timer, fx, winner, targets;
const $ = id => document.getElementById(id);
const alive = () => pieces.filter(p => p.hp > 0);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const setMsg = s => $('info').textContent = s;

function reset() {
  pieces = [];
  for (let s = 0; s < 2; s++)
    for (const [t, c, r] of LAYOUT) {
      const T = TYPES[t];
      pieces.push({ s, t, T, x: gx(c), y: gy(s ? 9 - r : r), vx: 0, vy: 0, hp: T.hp, hd: s ? Math.PI / 2 : -Math.PI / 2 });
    }
  turn = 0; state = 'aim'; drag = null; fx = []; winner = null; targets = [];
  updateHeader(); $('skip').disabled = true;
  setMsg('拉動己方棋子移動（輕點＝原地不動），停下後點選要攻擊的敵人。');
}
function updateHeader() {
  $('turn').textContent = SIDE[turn].name + ' 回合';
  $('turn').style.color = turn ? '#ddd' : '#ff7b6b';
}

// ----- 物理 -----
const inRiver = p => p.y > gy(4) && p.y < gy(5);
function bounds(p) {
  if (p.T.palace) return p.s ? [gx(3), gy(0), gx(5), gy(2)] : [gx(3), gy(7), gx(5), gy(9)];
  return [R, R, W - R, H - R];
}
function moveOne(p, dt) {
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > 0) {
    const ns = Math.max(0, sp - FR * (inRiver(p) ? RIVER_FR : 1) * dt);
    p.vx *= ns / sp; p.vy *= ns / sp;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  const [x0, y0, x1, y1] = bounds(p);
  if (p.x < x0) { p.x = x0; p.vx = -p.vx * 0.6; }
  if (p.x > x1) { p.x = x1; p.vx = -p.vx * 0.6; }
  if (p.y < y0) { p.y = y0; p.vy = -p.vy * 0.6; }
  if (p.y > y1) { p.y = y1; p.vy = -p.vy * 0.6; }
}
function collide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d >= 2 * R || d === 0) return;
  const nx = dx / d, ny = dy / d, ma = a.T.mass, mb = b.T.mass, ov = 2 * R - d;
  a.x -= nx * ov * mb / (ma + mb); a.y -= ny * ov * mb / (ma + mb);
  b.x += nx * ov * ma / (ma + mb); b.y += ny * ov * ma / (ma + mb);
  const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
  if (vn <= 0) return;
  const j = (1 + E) * vn / (1 / ma + 1 / mb);
  a.vx -= j / ma * nx; a.vy -= j / ma * ny;
  b.vx += j / mb * nx; b.vy += j / mb * ny;
}
function physics(dt) {
  const ps = alive();
  for (const p of ps) {
    moveOne(p, dt);
    if (Math.hypot(p.vx, p.vy) > 40) p.hd = Math.atan2(p.vy, p.vx);
  }
  for (let i = 0; i < ps.length; i++)
    for (let j = i + 1; j < ps.length; j++) collide(ps[i], ps[j]);
}
function predict(p, vx, vy) {
  const q = { x: p.x, y: p.y, vx, vy, T: p.T, s: p.s }, pts = [[q.x, q.y]];
  for (let i = 0; i < 600 && (q.vx || q.vy); i++) { moveOne(q, 1 / 120); if (i % 4 === 0) pts.push([q.x, q.y]); }
  pts.push([q.x, q.y]);
  return pts;
}
function pullInfo() {
  const p = drag.p, dx = p.x - drag.x, dy = p.y - drag.y, len = Math.hypot(dx, dy);
  const pw = Math.min(len, MAXPULL) / MAXPULL;
  const v = Math.sqrt(2 * FR * pw * p.T.dist);
  return { len, pw, vx: len ? dx / len * v : 0, vy: len ? dy / len * v : 0 };
}

// ----- 射擊判定 -----
// 直射：射線上若有其他棋子（任何一方）就被擋住
function blocked(a, b, x, y) {
  const dx = b.x - x, dy = b.y - y, d2 = dx * dx + dy * dy;
  return alive().some(p => {
    if (p === a || p === b) return false;
    const t = Math.max(0, Math.min(1, ((p.x - x) * dx + (p.y - y) * dy) / d2));
    return Math.hypot(p.x - (x + t * dx), p.y - (y + t * dy)) < R * 0.9;
  });
}
// 回傳 {p, ok, why}：在射程內的敵人與能否射擊
function scan(a, x = a.x, y = a.y) {
  return alive().filter(p => p.s !== a.s).map(p => {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d > a.T.range) return null;
    if (d < a.T.min) return { p, ok: false, why: '太近' };
    if (!a.T.indirect && blocked(a, p, x, y)) return { p, ok: false, why: '被擋' };
    return { p, ok: true };
  }).filter(Boolean);
}

// ----- 回合流程 -----
function onStop() {
  if (mover.hp <= 0) { state = 'fire'; timer = 0.6; return; }
  targets = scan(mover);
  if (targets.some(t => t.ok)) {
    state = 'target'; $('skip').disabled = false;
    setMsg(`點選黃色準星的敵人開火（${mover.T.n[mover.s]}・${mover.T.w}・威力 ${mover.T.dmg}），或按「不射擊」。`);
  } else {
    state = 'fire'; timer = 0.9;
    setMsg(targets.length ? '射程內的敵人都被擋住或太近，無法開火。' : '射程內沒有敵人。');
  }
}
function shoot(a, b) {
  b.hp = Math.max(0, b.hp - a.T.dmg);
  fx.push({ k: a.T.indirect ? 'arc' : 'line', x1: a.x, y1: a.y, x2: b.x, y2: b.y, col: a.s ? '#222' : '#e74c3c', t: 0.5, T: 0.5 });
  fx.push({ k: 'txt', x: b.x, y: b.y - R, txt: '-' + a.T.dmg, t: 1, T: 1 });
  if (b.hp <= 0) fx.push({ k: 'boom', x: b.x, y: b.y, t: 0.6, T: 0.6 });
  setMsg(`${a.T.n[a.s]} 用${a.T.w}攻擊 ${b.T.n[b.s]}，造成 ${a.T.dmg} 傷害` + (b.hp <= 0 ? '，擊毀！' : `（剩 ${b.hp}）`));
  checkWin();
}
function checkWin() {
  for (const s of [0, 1])
    if (!pieces.some(p => p.s === s && p.t === 'K' && p.hp > 0)) winner = 1 - s;
}
function endTurn() {
  if (winner !== null) { state = 'over'; return; }
  turn = 1 - turn; state = 'aim'; targets = []; updateHeader();
}
function update(dt) {
  if (state === 'moving') {
    for (let i = 0; i < 4; i++) physics(dt / 4);
    if (alive().every(p => Math.hypot(p.vx, p.vy) < 2)) { pieces.forEach(p => p.vx = p.vy = 0); onStop(); }
  } else if (state === 'fire') {
    timer -= dt; if (timer <= 0) endTurn();
  }
  fx.forEach(f => f.t -= dt); fx = fx.filter(f => f.t > 0);
}

// ----- 輸入 -----
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  const m = pos(e);
  if (state === 'over') { reset(); return; }
  if (state === 'target') {
    const t = targets.find(t => t.ok && Math.hypot(t.p.x - m.x, t.p.y - m.y) < R + 8);
    if (t) { shoot(mover, t.p); targets = []; $('skip').disabled = true; state = 'fire'; timer = 0.9; }
    return;
  }
  if (state !== 'aim') return;
  const p = alive().find(p => p.s === turn && Math.hypot(p.x - m.x, p.y - m.y) < R + 6);
  if (p) { drag = { p, x: m.x, y: m.y }; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => { if (drag) Object.assign(drag, pos(e)); });
cv.addEventListener('pointerup', () => {
  if (!drag) return;
  const { len, vx, vy } = pullInfo(), p = drag.p;
  drag = null; mover = p;
  if (len < 10) { onStop(); return; }          // 輕點：原地不動直接進入瞄準
  p.vx = vx; p.vy = vy; p.hd = Math.atan2(vy, vx);
  state = 'moving';
});
$('skip').onclick = () => {
  if (state !== 'target') return;
  targets = []; $('skip').disabled = true; state = 'fire'; timer = 0.2;
};
$('restart').onclick = reset;

// ----- 繪圖 -----
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function drawBoard() {
  ctx.fillStyle = '#e8c88a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#7fa7b866'; ctx.fillRect(0, gy(4), W, C);              // 河道（泥濘）
  ctx.fillStyle = '#c0392b14'; ctx.fillRect(gx(3), gy(7), 2 * C, 2 * C);  // 九宮
  ctx.fillStyle = '#0000000f'; ctx.fillRect(gx(3), gy(0), 2 * C, 2 * C);
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 1.5;
  for (let r = 0; r <= 9; r++) line(gx(0), gy(r), gx(8), gy(r));
  line(gx(0), gy(0), gx(0), gy(9)); line(gx(8), gy(0), gx(8), gy(9));
  for (let c = 1; c < 8; c++) { line(gx(c), gy(0), gx(c), gy(4)); line(gx(c), gy(5), gx(c), gy(9)); }
  for (const r of [0, 7]) { line(gx(3), gy(r), gx(5), gy(r + 2)); line(gx(5), gy(r), gx(3), gy(r + 2)); }
  ctx.lineWidth = 3; ctx.strokeRect(gx(0) - 6, gy(0) - 6, 8 * C + 12, 9 * C + 12);
  ctx.fillStyle = '#4a5f6b'; ctx.font = 'bold 22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('楚河（泥濘）', gx(2), gy(4.5)); ctx.fillText('漢界（泥濘）', gx(6), gy(4.5));
}
function drawPiece(p) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.hd);
  ctx.fillStyle = '#333';
  for (const [x, y] of [[-11, -R], [11, -R], [-11, R], [11, R]]) ctx.fillRect(x - 5, y - 3, 10, 6);
  ctx.fillStyle = SIDE[p.s].col; ctx.beginPath(); ctx.moveTo(R + 7, 0); ctx.lineTo(R - 1, -5); ctx.lineTo(R - 1, 5); ctx.fill();
  ctx.rotate(-p.hd);
  circle(0, 0, R); ctx.fillStyle = '#f6e3b8'; ctx.fill();
  ctx.strokeStyle = SIDE[p.s].col; ctx.lineWidth = 2.5; ctx.stroke();
  circle(0, 0, R - 4); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = SIDE[p.s].col; ctx.font = 'bold 20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.T.n[p.s], 0, 1);
  const k = p.hp / p.T.hp;
  ctx.fillStyle = '#0007'; ctx.fillRect(-R, R + 4, 2 * R, 5);
  ctx.fillStyle = k > 0.5 ? '#2ecc71' : k > 0.25 ? '#f1c40f' : '#e74c3c'; ctx.fillRect(-R, R + 4, 2 * R * k, 5);
  ctx.restore();
}
function rangeRing(p, x, y) {
  circle(x, y, p.T.range); ctx.fillStyle = '#c0392b14'; ctx.fill();
  ctx.strokeStyle = '#c0392b88'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.stroke();
  if (p.T.min) { circle(x, y, p.T.min); ctx.strokeStyle = '#5558'; ctx.stroke(); }
  ctx.setLineDash([]);
}
function marks(list) {
  for (const t of list) {
    const { x, y } = t.p;
    if (t.ok) {
      ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3;
      circle(x, y, R + 7 + Math.sin(performance.now() / 120) * 2); ctx.stroke();
      line(x - R - 12, y, x - R - 2, y); line(x + R + 2, y, x + R + 12, y);
      line(x, y - R - 12, x, y - R - 2); line(x, y + R + 2, x, y + R + 12);
    } else {
      ctx.strokeStyle = '#7778'; ctx.lineWidth = 2; circle(x, y, R + 5); ctx.stroke();
      ctx.fillStyle = '#555'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(t.why, x, y - R - 12);
    }
  }
}
function draw() {
  drawBoard();
  if (state === 'aim') for (const p of alive()) if (p.s === turn) {
    circle(p.x, p.y, R + 5); ctx.strokeStyle = turn ? '#0005' : '#c0392b66'; ctx.lineWidth = 3; ctx.stroke();
  }
  let preview = [];
  if (drag) {
    const p = drag.p, { len, pw, vx, vy } = pullInfo();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); line(p.x, p.y, drag.x, drag.y); ctx.setLineDash([]);
    let ex = p.x, ey = p.y;
    if (len >= 10) {
      const pts = predict(p, vx, vy); [ex, ey] = pts[pts.length - 1];
      ctx.strokeStyle = SIDE[p.s].col; ctx.lineWidth = 2; ctx.beginPath();
      pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      circle(ex, ey, R); ctx.stroke();
      setMsg(`${p.T.n[p.s]}（${p.T.w}）力道 ${Math.round(pw * 100)}%　射程 ${(p.T.range / C).toFixed(1)} 格　威力 ${p.T.dmg}`);
    } else setMsg(`${p.T.n[p.s]}：往後拉移動，或直接放開＝原地射擊`);
    rangeRing(p, ex, ey);
    preview = scan(p, ex, ey);
  }
  if (state === 'target') rangeRing(mover, mover.x, mover.y);
  for (const p of alive()) drawPiece(p);
  marks(state === 'target' ? targets : preview);
  for (const f of fx) {
    const a = f.t / f.T;
    ctx.globalAlpha = a;
    if (f.k === 'line') { ctx.strokeStyle = f.col; ctx.lineWidth = 4; line(f.x1, f.y1, f.x2, f.y2); }
    if (f.k === 'arc') {
      const mx = (f.x1 + f.x2) / 2, my = (f.y1 + f.y2) / 2 - Math.hypot(f.x2 - f.x1, f.y2 - f.y1) * 0.4;
      ctx.strokeStyle = f.col; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.quadraticCurveTo(mx, my, f.x2, f.y2); ctx.stroke(); ctx.setLineDash([]);
    }
    if (f.k === 'txt') { ctx.fillStyle = '#e00'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(f.txt, f.x, f.y - (1 - a) * 30); }
    if (f.k === 'boom') { circle(f.x, f.y, R + (1 - a) * 30); ctx.fillStyle = '#f39c12'; ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  if (state === 'over') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = winner ? '#fff' : '#ff7b6b'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(SIDE[winner].name + ' 勝利！', W / 2, H / 2 - 10);
    ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif'; ctx.fillText('點擊棋盤重新開始', W / 2, H / 2 + 34);
  }
}
let last = performance.now();
function loop(now) { update(Math.min(0.05, (now - last) / 1000)); last = now; draw(); requestAnimationFrame(loop); }

$('legend').innerHTML = '<tr><th>兵種</th><th>武器</th><th>血量</th><th>移動力</th><th>射程(格)</th><th>威力</th><th>特性</th></tr>' +
  Object.values(TYPES).map(T => `<tr><td>${T.n.join('/')}</td><td>${T.w}</td><td>${T.hp}</td><td>${(T.dist / C).toFixed(1)}</td>` +
    `<td>${T.min ? (T.min / C).toFixed(1) + '～' : ''}${(T.range / C).toFixed(1)}</td><td>${T.dmg}</td>` +
    `<td>${T.indirect ? '曲射，越過障礙' : T.palace ? '限九宮' : '直射，會被擋'}</td></tr>`).join('');
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
