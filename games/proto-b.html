<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>原型 B：回力車象棋・戰術瞄準</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1f2a24; color:#eef3e8; font:15px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { width:100%; max-width:560px; padding:8px 12px; display:flex; gap:8px; align-items:center; justify-content:space-between; }
  header a { color:#e8c88a; text-decoration:none; }
  #turn { font-weight:700; font-size:18px; }
  #bar { width:100%; max-width:560px; padding:0 12px 6px; display:flex; gap:8px; align-items:flex-start; }
  #info { flex:1; min-height:2.8em; font-size:14px; }
  canvas { width:min(96vw, 560px, calc((100vh - 140px) * 520 / 576)); display:block; touch-action:none; border-radius:6px; box-shadow:0 4px 18px #0008; }
  button { background:#e8c88a; color:#2b2118; border:0; border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  #fire { background:#e74c3c; color:#fff; font-weight:700; }
  table { margin:10px 0 20px; border-collapse:collapse; font-size:13px; }
  td, th { padding:3px 8px; border-bottom:1px solid #3d4f44; text-align:center; }
</style>
</head>
<body>
<header>
  <a href="index.html">← 選單</a>
  <span id="turn"></span>
  <span><button id="mute" title="音效開關">🔊</button> <button id="restart">重新開始</button></span>
</header>
<div id="bar"><div id="info"></div><button id="fire" hidden>發射</button><button id="skip" disabled>不射擊</button></div>
<canvas id="cv"></canvas>
<table id="legend"></table>
<script>
// ===== 原型 B：移動 + 手動瞄準 =====
// 回合 = ① 拉動一台車（或輕點原地不動） ② 從射程內的敵人中點選目標開火。
// 直射武器會被中間的棋子擋住；炮為曲射可越過棋子但有最小射程。
// 河道泥濘（摩擦加倍），帥/將被限制在九宮內。
const C = 56, M = 36, W = C * 8 + M * 2, H = C * 9 + M * 2, R = 21;
const FR = 900, RIVER_FR = 2.6, MAXPULL = 120, E = 0.85, DPR = 2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
const gx = c => M + c * C, gy = r => M + r * C;

const SIDE = [{ name: '紅方', col: '#c0392b' }, { name: '黑方', col: '#1d1d1d' }];
const TYPES = {
  K: { n: ['帥', '將'], hp: 5, dist: 1.5 * C, range: 1.5 * C, min: 0,     dmg: 1, mass: 3,   w: '手槍',   snd: 'pistol', proj: 'bullet', palace: true },
  R: { n: ['俥', '車'], hp: 4, dist: 7 * C,   range: 2.6 * C, min: 0,     dmg: 1, mass: 2,   w: '機槍',   snd: 'mg',     proj: 'burst' },
  N: { n: ['傌', '馬'], hp: 3, dist: 4.5 * C, range: 3.4 * C, min: 0,     dmg: 2, mass: 1.5, w: '火箭',   snd: 'rocket', proj: 'rocket' },
  C: { n: ['炮', '砲'], hp: 3, dist: 2.5 * C, range: 5.2 * C, min: 2 * C, dmg: 2, mass: 1.5, w: '曲射砲', snd: 'mortar', proj: 'shell', indirect: true, reload: 3 },   // 射後需裝填 3 回合
  P: { n: ['兵', '卒'], hp: 2, dist: 1 * C,   range: 1.8 * C, min: 0,     dmg: 1, mass: 1,   w: '步槍',   snd: 'rifle',  proj: 'bullet', tag: '（未過河）', locked: true },
  // 過河兵：自由移動，霰彈槍 9 發彈丸呈扇形，越近命中越多（每 3 發 1 心，最多 3 心）
  P2: { n: ['兵', '卒'], hp: 2, dist: 3.5 * C, range: 2.6 * C, min: 0,    dmg: 3, mass: 1,   w: '霰彈槍', snd: 'shotgun', proj: 'pellets', tag: '（過河）',
        pellets: 9, cone: 30 * Math.PI / 180 },
};
const LAYOUT = [['K',4,9],['R',0,9],['R',8,9],['N',1,9],['N',7,9],['C',1,7],['C',7,7],
                ['P',0,6],['P',2,6],['P',4,6],['P',6,6],['P',8,6]];

let pieces, turn, state, drag, mover, timer, fx, winner, targets;
let moved = false, firedPiece = null, dragging = false;   // dragging：手指正按著拉   // moved：本回合是否已移動（未移動才能取消）
const $ = id => document.getElementById(id);
const alive = () => pieces.filter(p => p.hp > 0);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const setMsg = s => $('info').textContent = s;
const hearts = n => '♥'.repeat(n);   // 血量與傷害都以愛心計
const rnd = k => (Math.random() - 0.5) * 2 * k;

// ----- 音效（Web Audio 即時合成，不需要音檔） -----
const SFX = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('rc-mute') === '1'; } catch (e) {}
  const VOL = 0.6;
  function init() {   // 瀏覽器規定要在使用者操作後才能出聲
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : VOL; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  // 振盪器：波形、起訖頻率、長度、音量、延遲
  function tone(type, f0, f1, dur, vol, delay = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  // 濾波噪音：濾波起訖頻率、長度、音量、延遲
  function noise(f0, f1, dur, vol, delay = 0, type = 'lowpass', q = 1) {
    const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.02);
  }
  const S = {
    click:   () => tone('square', 1000, 700, 0.04, 0.08),
    ratchet: k => tone('square', 260 + k * 520, 180 + k * 400, 0.025, 0.07),
    launch:  k => { noise(500, 3500, 0.35, 0.2 + 0.25 * k, 0, 'bandpass', 2); tone('sawtooth', 110, 140 + 320 * k, 0.4, 0.06); },
    bump:    v => { const k = Math.min(1, v / 600); tone('sine', 190, 55, 0.16, 0.45 * k); noise(2200, 300, 0.08, 0.3 * k); },
    pistol:  () => { noise(4000, 400, 0.12, 0.5); tone('square', 650, 120, 0.08, 0.14); },
    mg:      () => { for (let i = 0; i < 4; i++) { noise(5000, 500, 0.07, 0.42, i * 0.07); tone('square', 520, 140, 0.05, 0.1, i * 0.07); } },
    rifle:   () => { noise(6500, 300, 0.22, 0.6); tone('triangle', 950, 90, 0.16, 0.2); },
    rocket:  () => { noise(700, 3200, 0.5, 0.35, 0, 'bandpass', 1.5); tone('sawtooth', 180, 620, 0.45, 0.05); },
    mortar:  () => { tone('sine', 150, 40, 0.25, 0.7); noise(700, 100, 0.25, 0.4); tone('sine', 2300, 650, 0.65, 0.05, 0.15); },
    hit:     () => { tone('square', 320, 80, 0.12, 0.22); noise(3000, 200, 0.15, 0.35); },
    boom:    big => { noise(1800, 50, big ? 1.3 : 0.7, big ? 0.9 : 0.6); tone('sine', 110, 28, big ? 0.9 : 0.5, big ? 0.8 : 0.5); },
    shotgun: () => { noise(3500, 150, 0.35, 0.85); tone('square', 220, 50, 0.14, 0.3);
                     noise(2500, 1800, 0.05, 0.25, 0.32, 'bandpass', 3); noise(2000, 1500, 0.06, 0.25, 0.45, 'bandpass', 3); },  // 砰＋上膛
    promote: () => [392, 523, 659].forEach((f, i) => tone('square', f, f, 0.12, 0.1, i * 0.08)),
    win:     () => [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, i === 3 ? 0.7 : 0.3, 0.25, i * 0.14)),
  };
  return {
    init,
    play(n, ...a) { if (ac && !muted) S[n](...a); },
    toggle() {
      muted = !muted;
      try { localStorage.setItem('rc-mute', muted ? '1' : '0'); } catch (e) {}
      if (master) master.gain.value = muted ? 0 : VOL;
      return muted;
    },
    get muted() { return muted; },
  };
})();

// ----- 粒子特效 -----
let parts = [], decals = [], shake = 0, lastBump = 0;
// o: {k 種類, sp 速度, life 壽命, size, col, dir 方向（省略＝四散）, spread 擴散角, drag 阻力}
function emit(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = o.dir === undefined ? Math.random() * Math.PI * 2 : o.dir + rnd((o.spread || 1) / 2);
    const sp = o.sp * (0.3 + Math.random() * 0.7), L = o.life * (0.6 + Math.random() * 0.4);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: L, L, size: o.size * (0.6 + Math.random() * 0.6),
                 col: o.col, k: o.k, drag: o.drag ?? 3, rot: Math.random() * 6 });
  }
}
function flashAt(x, y, size, t = 0.12) { parts.push({ x, y, vx: 0, vy: 0, t, L: t, size, k: 'flash', drag: 0 }); }
function muzzle(x, y, dir, big) {
  flashAt(x, y, big ? 26 : 16);
  emit(x, y, big ? 10 : 5, { k: 'spark', sp: 260, life: 0.18, size: 2, col: '#ffe066', dir, spread: 0.9 });
  emit(x, y, big ? 6 : 2, { k: 'smoke', sp: 50, life: 0.7, size: 8, col: '#888', dir, spread: 1.2 });
}
function explode(x, y, big) {
  flashAt(x, y, big ? 60 : 34, big ? 0.16 : 0.1);
  parts.push({ x, y, vx: 0, vy: 0, t: 0.35, L: 0.35, size: big ? 75 : 42, k: 'ring', drag: 0 });
  emit(x, y, big ? 40 : 18, { k: 'spark', sp: big ? 340 : 230, life: 0.5, size: 2.5, col: '#ffd23f' });
  emit(x, y, big ? 16 : 8,  { k: 'fire',  sp: big ? 120 : 80,  life: 0.45, size: big ? 16 : 11, col: '#ff7a1a' });
  emit(x, y, big ? 18 : 8,  { k: 'smoke', sp: big ? 60 : 40,   life: big ? 1.5 : 1, size: big ? 18 : 12, col: '#555' });
  if (big) emit(x, y, 12, { k: 'debris', sp: 280, life: 0.9, size: 5, col: '#3a2a1a', drag: 2.5 });
  decals.push({ x: x + rnd(4), y: y + rnd(4), r: big ? 30 + Math.random() * 6 : 13 });
  shake = Math.max(shake, big ? 12 : 5);
}
function bumpFX(x, y, v) {
  const now = performance.now();
  if (now - lastBump > 60) { SFX.play('bump', v); lastBump = now; }
  if (v > 250) emit(x, y, 6, { k: 'spark', sp: 180, life: 0.25, size: 2, col: '#fff3b0' });
  if (v > 450) shake = Math.max(shake, 3);
}
function updParts(dt) {
  for (const p of parts) {
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f;
    if (p.k === 'smoke') p.y -= 12 * dt;
  }
  parts = parts.filter(p => p.t > 0);
  shake = Math.max(0, shake - 40 * dt);
}

function reset() {
  pieces = [];
  for (let s = 0; s < 2; s++)
    for (const [t, c, r] of LAYOUT) {
      const T = TYPES[t];
      pieces.push({ s, t, T, x: gx(c), y: gy(s ? 9 - r : r), vx: 0, vy: 0, hp: T.hp, hd: s ? Math.PI / 2 : -Math.PI / 2, flash: 0, recoil: 0, cd: 0 });
    }
  turn = 0; state = 'aim'; drag = null; dragging = false; fx = []; moved = false; firedPiece = null; winner = null; targets = []; parts = []; decals = []; shake = 0;
  updateHeader(); $('skip').disabled = true;
  setMsg('拉動己方棋子移動（輕點＝原地不動），停下後點選要攻擊的敵人。');
}
function updateHeader() {
  $('turn').textContent = SIDE[turn].name + ' 回合';
  $('turn').style.color = turn ? '#ddd' : '#ff7b6b';
}

// ----- 物理 -----
const inRiver = p => p.y > gy(4) && p.y < gy(5);
function bounds(p) {
  if (p.T.palace) return p.s ? [gx(3), gy(0), gx(5), gy(2)] : [gx(3), gy(7), gx(5), gy(9)];
  return [R, R, W - R, H - R];
}
function moveOne(p, dt) {
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > 0) {
    const ns = Math.max(0, sp - FR * (inRiver(p) ? RIVER_FR : 1) * dt);
    p.vx *= ns / sp; p.vy *= ns / sp;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  const [x0, y0, x1, y1] = bounds(p);
  let bump = 0;   // 撞牆速度（給音效用）
  if (p.x < x0) { p.x = x0; bump = Math.abs(p.vx); p.vx = -p.vx * 0.6; }
  if (p.x > x1) { p.x = x1; bump = Math.abs(p.vx); p.vx = -p.vx * 0.6; }
  if (p.y < y0) { p.y = y0; bump = Math.max(bump, Math.abs(p.vy)); p.vy = -p.vy * 0.6; }
  if (p.y > y1) { p.y = y1; bump = Math.max(bump, Math.abs(p.vy)); p.vy = -p.vy * 0.6; }
  return bump;
}
function collide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d >= 2 * R || d === 0) return;
  const nx = dx / d, ny = dy / d, ma = a.T.mass, mb = b.T.mass, ov = 2 * R - d;
  a.x -= nx * ov * mb / (ma + mb); a.y -= ny * ov * mb / (ma + mb);
  b.x += nx * ov * ma / (ma + mb); b.y += ny * ov * ma / (ma + mb);
  const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
  if (vn <= 0) return;
  const j = (1 + E) * vn / (1 / ma + 1 / mb);
  a.vx -= j / ma * nx; a.vy -= j / ma * ny;
  b.vx += j / mb * nx; b.vy += j / mb * ny;
  if (vn > 80) bumpFX(a.x + nx * R, a.y + ny * R, vn);
}
function physics(dt) {
  const ps = alive();
  for (const p of ps) {
    const bump = moveOne(p, dt), sp = Math.hypot(p.vx, p.vy);
    if (bump > 100) bumpFX(p.x, p.y, bump);
    if (sp > 40) p.hd = Math.atan2(p.vy, p.vx);
    if (sp > 150 && Math.random() < 0.15)   // 車尾揚起塵土（河道是水花）
      emit(p.x - Math.cos(p.hd) * R, p.y - Math.sin(p.hd) * R, 1,
           { k: 'smoke', sp: 30, life: 0.6, size: 7, col: inRiver(p) ? '#9cc3d5' : '#b89a6a', dir: p.hd + Math.PI, spread: 1.5 });
  }
  for (let i = 0; i < ps.length; i++)
    for (let j = i + 1; j < ps.length; j++) collide(ps[i], ps[j]);
}
function predict(p, vx, vy) {
  const q = { x: p.x, y: p.y, vx, vy, T: p.T, s: p.s }, pts = [[q.x, q.y]];
  for (let i = 0; i < 600 && (q.vx || q.vy); i++) { moveOne(q, 1 / 120); if (i % 4 === 0) pts.push([q.x, q.y]); }
  pts.push([q.x, q.y]);
  return pts;
}
// 未過河的兵：只能直直往前，且固定走一格（考慮河道摩擦，用二分法求初速）
const fwd = p => p.s ? 1 : -1;
const crossed = (s, y) => s ? y > gy(4.5) : y < gy(4.5);
function speedForOneStep(p) {
  let lo = 0, hi = 2000;
  for (let i = 0; i < 18; i++) {
    const v = (lo + hi) / 2, pts = predict(p, 0, v * fwd(p)), [, ey] = pts[pts.length - 1];
    if (Math.abs(ey - p.y) < C) lo = v; else hi = v;
  }
  return lo;
}
// 拉動向量 = 按下點 − 目前手指位置（從棋子哪裡按下都一樣，輕碰不會變成拉動）
const TAP = 16;   // 小於這個距離都算「輕點」
function pullInfo() {
  const p = drag.p, dx = drag.sx - drag.x, dy = drag.sy - drag.y, len = Math.hypot(dx, dy);
  if (p.T.locked) return { len, dx, dy, pw: 1, vx: 0, vy: drag.v1 * fwd(p) };
  const pw = Math.min(len, MAXPULL) / MAXPULL;
  const v = Math.sqrt(2 * FR * pw * p.T.dist);
  return { len, dx, dy, pw, vx: len ? dx / len * v : 0, vy: len ? dy / len * v : 0 };
}

// ----- 射擊判定 -----
// 直射：射線上若有其他棋子（任何一方）就被擋住
function blocked(a, b, x, y) {
  const dx = b.x - x, dy = b.y - y, d2 = dx * dx + dy * dy;
  return alive().some(p => {
    if (p === a || p === b) return false;
    const t = Math.max(0, Math.min(1, ((p.x - x) * dx + (p.y - y) * dy) / d2));
    return Math.hypot(p.x - (x + t * dx), p.y - (y + t * dy)) < R * 0.9;
  });
}
// 霰彈：從 (x,y) 朝 b 射出扇形彈丸，每發打到射線上第一顆棋子；回傳各彈丸終點與每顆敵人被打幾發
function shotgunSim(a, b, x = a.x, y = a.y, T = a.T) {
  const dir = Math.atan2(b.y - y, b.x - x), rays = [], count = new Map();
  for (let i = 0; i < T.pellets; i++) {
    const ang = dir + T.cone * (i / (T.pellets - 1) - 0.5), dx = Math.cos(ang), dy = Math.sin(ang);
    let best = null, bt = T.range;
    for (const p of alive()) {
      if (p === a) continue;
      const ox = p.x - x, oy = p.y - y, t = ox * dx + oy * dy, perp2 = ox * ox + oy * oy - t * t;
      if (t <= 0 || perp2 > R * R) continue;
      const th = t - Math.sqrt(R * R - perp2);
      if (th < bt) { bt = th; best = p; }
    }
    rays.push({ dir: ang, x: x + dx * bt, y: y + dy * bt, p: best });
    if (best && best.s !== a.s) count.set(best, (count.get(best) || 0) + 1);
  }
  return { rays, count };
}
const pelletDmg = n => n ? Math.max(1, Math.floor(n / 3)) : 0;

// 回傳 {p, ok, why, est}：在射程內的敵人、能否射擊、預估傷害
function scan(a, x = a.x, y = a.y, T = a.T) {
  return alive().filter(p => p.s !== a.s).map(p => {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d > T.range) return null;
    if (a.cd > 0) return { p, ok: false, why: `裝填中 ${a.cd}` };
    if (d < T.min) return { p, ok: false, why: '太近' };
    if (!T.indirect && blocked(a, p, x, y)) return { p, ok: false, why: '被擋' };
    return { p, ok: true, est: T.pellets ? pelletDmg(shotgunSim(a, p, x, y, T).count.get(p) || 0) : T.dmg };
  }).filter(Boolean);
}
// 兵過河後永久升級成霰彈兵
function promoteCrossed() {
  for (const p of alive())
    if (p.T.locked && crossed(p.s, p.y)) {
      p.T = TYPES.P2; p.flash = 0.3;
      fx.push({ k: 'txt', x: p.x, y: p.y - R - 6, txt: '過河！霰彈槍', t: 1.4, T: 1.4, col: '#d48a00' });
      emit(p.x, p.y, 14, { k: 'spark', sp: 150, life: 0.5, size: 2.5, col: '#ffd23f' });
      SFX.play('promote');
    }
}

// ----- 回合流程 -----
const reloadMsg = p => `${p.T.n[p.s]}裝填中，還要 ${p.cd} 回合才能再射擊。`;
function setSkip(on) {
  $('skip').disabled = !on;
  $('skip').textContent = moved ? '不射擊' : '取消';
  $('fire').hidden = state !== 'armed';
}
function onStop() {
  promoteCrossed();
  if (mover.hp <= 0) { state = 'fire'; timer = 0.6; return; }

    ctx.beginPath(); ctx.ellipse(gx0, gy0, 7 - lift * 3, 4 - lift * 2, 0, 0, Math.PI * 2); ctx.fill();
    circle(x, y, 5 + lift * 3); ctx.fillStyle = '#222'; ctx.fill();
    circle(x - 1.5, y - 1.5, 1.5 + lift); ctx.fillStyle = '#888'; ctx.fill();
  }
}
function draw() {
  ctx.save();
  if (shake) ctx.translate(rnd(shake), rnd(shake));
  drawBoard();
  drawDecals();
  if (state === 'aim') for (const p of alive()) if (p.s === turn) {
    circle(p.x, p.y, R + 5); ctx.strokeStyle = turn ? '#0005' : '#c0392b66'; ctx.lineWidth = 3; ctx.stroke();
  }
  let preview = [];
  if (drag) {
    const p = drag.p, { len, pw, vx, vy, dx, dy } = pullInfo();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); line(p.x, p.y, p.x - dx, p.y - dy); ctx.setLineDash([]);
    let ex = p.x, ey = p.y;
    if (state === 'armed') { circle(p.x, p.y, R + 6); ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3; ctx.stroke(); }
    if (len >= TAP) {
      const pts = predict(p, vx, vy); [ex, ey] = pts[pts.length - 1];
      ctx.strokeStyle = SIDE[p.s].col; ctx.lineWidth = 2; ctx.beginPath();
      pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      circle(ex, ey, R); ctx.stroke();
      if (!dragging) { /* 已瞄準：保留確認說明 */ }
      else if (p.T.locked) setMsg(`${p.T.n[p.s]}未過河：只能往前走一格` + (crossed(p.s, ey) ? '（這步過河，升級霰彈槍！）' : ''));
      else setMsg(`${p.T.n[p.s]}（${p.T.w}）力道 ${Math.round(pw * 100)}%　射程 ${(p.T.range / C).toFixed(1)} 格　` +
                  (p.T.pellets ? '越近越痛（最多 ' + hearts(p.T.dmg) + '）' : '威力 ' + hearts(p.T.dmg)));
    } else if (dragging) setMsg(`${p.T.n[p.s]}：往後拉移動` + (p.T.locked ? '（未過河，只能前進一格）' : '') + '；放開後還要確認才會發射，拉回原處放開＝原地瞄準' +
                  (p.cd > 0 ? `　⚠ 裝填中還要 ${p.cd} 回合` : ''));
    const T = p.T.locked && crossed(p.s, ey) ? TYPES.P2 : p.T;   // 這步會過河就用霰彈槍預覽
    rangeRing({ T }, ex, ey);
    preview = scan(p, ex, ey, T);
  }
  if (state === 'target') {
    rangeRing(mover, mover.x, mover.y);
    if (!moved) { circle(mover.x, mover.y, R + 6); ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]); }
  }
  for (const p of alive()) drawPiece(p);
  marks(state === 'target' ? targets : preview);
  for (const f of fx) if (f.k !== 'txt') drawProj(f);
  drawParts();
  for (const f of fx) if (f.k === 'txt') {
    const a = f.t / f.T;
    ctx.globalAlpha = Math.min(1, a * 2); ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.strokeText(f.txt, f.x, f.y - (1 - a) * 30);
    ctx.fillStyle = f.col || '#e00'; ctx.fillText(f.txt, f.x, f.y - (1 - a) * 30);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (state === 'over') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = winner ? '#fff' : '#ff7b6b'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(SIDE[winner].name + ' 勝利！', W / 2, H / 2 - 10);
    ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif'; ctx.fillText('點擊棋盤重新開始', W / 2, H / 2 + 34);
  }
}
let last = performance.now();
function loop(now) { update(Math.min(0.05, (now - last) / 1000)); last = now; draw(); requestAnimationFrame(loop); }

$('legend').innerHTML = '<tr><th>兵種</th><th>武器</th><th>血量</th><th>移動力</th><th>射程(格)</th><th>威力</th><th>特性</th></tr>' +
  Object.values(TYPES).map(T => `<tr><td>${T.n.join('/')}${T.tag || ''}</td><td>${T.w}</td><td style="color:#e8202a">${hearts(T.hp)}</td><td>${(T.dist / C).toFixed(1)}</td>` +
    `<td>${T.min ? (T.min / C).toFixed(1) + '～' : ''}${(T.range / C).toFixed(1)}</td><td style="color:#e8202a">${hearts(T.dmg)}</td>` +
    `<td>${T.indirect ? `曲射，越過障礙；射後裝填 ${T.reload} 回合` : T.palace ? '限九宮' : T.locked ? '只能前進一格' : T.pellets ? '扇形霰彈，越近越痛' : '直射，會被擋'}</td></tr>`).join('');
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
