name: 更新報酬率

on:
  schedule:
    - cron: "0 7 * * 1-5"    # 台北 15:00（台股收盤後）
    - cron: "0 22 * * 1-5"   # 台北隔天 06:00（美股、英股收盤後）
  workflow_dispatch:          # 可在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 產生 index.html
        env:
          TZ: Asia/Taipei
          PYTHONIOENCODING: utf-8
        run: python build.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add returns.html history.json
          git diff --cached --quiet || (git commit -m "更新資料 $(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')" && git push)
