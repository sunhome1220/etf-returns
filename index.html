<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資工具</title>
<style>
  :root { --bd:#d9d9d9; --green:#2c7a3f; --text:#222; --muted:#666; --bg:#fff; --card:#fafafa; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 "Microsoft JhengHei","PingFang TC",sans-serif; background:var(--bg); color:var(--text); }
  header { border-bottom:1px solid var(--bd); background:#f7f7f7; }
  .nav { max-width:960px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:24px; height:52px; }
  .brand { font-weight:700; font-size:17px; color:var(--text); text-decoration:none; }
  .nav ul { list-style:none; display:flex; gap:4px; margin:0; padding:0; flex-wrap:wrap; }
  .nav a.item { display:block; padding:6px 12px; border-radius:4px; color:var(--text); text-decoration:none; }
  .nav a.item:hover { background:#e8f2ea; color:var(--green); }
  main { max-width:960px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .lead { color:var(--muted); margin:0 0 24px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .card { display:block; border:1px solid var(--bd); border-radius:6px; padding:18px; background:var(--card); color:var(--text); text-decoration:none; }
  .card:hover { border-color:var(--green); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .card h2 { font-size:17px; margin:0 0 6px; color:var(--green); }
  .card p { margin:0; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header>
  <nav class="nav">
    <a class="brand" href="./">投資工具</a>
    <ul>
      <li><a class="item" href="returns.html">各年度含息報酬率</a></li>
      <li><a class="item" href="watchlist.html">我的追蹤清單</a></li>
      <li><a class="item" href="wall/">拼接大螢幕</a></li>
    </ul>
  </nav>
</header>
<main>
  <h1>功能列表</h1>
  <p class="lead">選擇上方或下方的功能項目。</p>
  <div class="cards">
    <a class="card" href="returns.html">
      <h2>各年度含息報酬率</h2>
      <p>台股、美股、英股 ETF 與個股近十年含息報酬率，可篩選、排序、勾選，並自行新增代碼。每個交易日自動更新。</p>
    </a>
    <a class="card" href="watchlist.html">
      <h2>我的追蹤清單</h2>
      <p>維護個人追蹤的 ETF、個股：新增、移除、修改名稱/區/類，可匯出匯入備份。報酬率清單依此顯示並同步。</p>
    </a>
    <a class="card" href="wall/">
      <h2>拼接大螢幕</h2>
      <p>多支手機、平板排在一起組成一個大畫面，依裝置數量與尺寸自動排列。第一個進入者為管理者，可顯示固定文字、跑馬燈或圖片；同步後斷網仍可持續播放。</p>
    </a>
  </div>
</main>
</body>
</html>
